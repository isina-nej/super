services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-download_bot}
      MYSQL_USER: ${MYSQL_USER:-bot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-botpass}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PUBLISH_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PUBLISH_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?Set TELEGRAM_API_ID in .env}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?Set TELEGRAM_API_HASH in .env}
      TELEGRAM_LOCAL: "1"
    volumes:
      - telegram_bot_api_data:/var/lib/telegram-bot-api
      - media_data:/media
    ports:
      - "${TELEGRAM_BOT_API_PUBLISH_PORT:-8081}:8081"
    # Official image reads TELEGRAM_* env; --local via TELEGRAM_LOCAL=1

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      MEDIA_ROOT: /media
      YTDLP_COOKIES_FILE: ${YTDLP_COOKIES_FILE:-/cookies/cookies.json}
      YTDLP_PROXY: ${YTDLP_PROXY:-}
    volumes:
      - media_data:/media
      - ./cookies:/cookies:ro
    ports:
      - "${API_PUBLISH_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      MEDIA_ROOT: /media
      YTDLP_COOKIES_FILE: ${YTDLP_COOKIES_FILE:-/cookies/cookies.json}
      YTDLP_PROXY: ${YTDLP_PROXY:-}
    volumes:
      - media_data:/media
      - ./cookies:/cookies:ro
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      API_BASE_URL: http://api:8000/api/v1
      TELEGRAM_BOT_API_URL: http://telegram-bot-api:8081
      MEDIA_ROOT: /media
    volumes:
      - media_data:/media
    depends_on:
      - api
      - telegram-bot-api
      - worker

volumes:
  mysql_data:
  telegram_bot_api_data:
  media_data:
